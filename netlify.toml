# Netlify configuration for dalohiollc.com
#
# HISTORY, because this file's arrival looks odd in the log: a netlify.toml (261 bytes)
# existed in the LIVE deploy of 2026-08-06 but was never committed here, so the repo and
# production had drifted. Its content could not be recovered - Netlify's API returns file
# metadata only and does not serve netlify.toml over HTTP - so this is a deliberate
# minimal reconstruction rather than the original bytes.
#
# The original's observable behaviour was nil, which is why replacing it is safe:
#   - the 2026-08-06 deploy summary reports "No redirect rules processed"
#   - the site's build_settings were empty when this was written. The repo was linked on
#     2026-09-18: build_settings had carried repo_url since 2026-09-01 but no deploy_key_id,
#     so every build died at 'preparing repo'. A Netlify deploy key was created and added to
#     the GitHub repo read-only, and the first successful auto-deploy ran the same day.
#   - the only security header on a live response is Netlify's automatic HSTS
#
# Site-level settings live in the Netlify UI/API, NOT here. Do not move them into this file
# without checking the dashboard first - duplicating them is how they drift.
#   pretty_urls        = true
#   ignore_html_forms  = false   <- CHANGED 2026-08-18. It was true, which is Netlify's
#     default for a site that has never had a form, and it is what made the contact form
#     answer "404 Page not found" on submit: form detection runs while a deploy is being
#     processed, so with it on the form was never registered and the POST had no handler
#     to reach. The markup was never at fault. An earlier version of this comment recorded
#     the setting as "left alone" - do not put it back, and note that flipping it only
#     takes effect on the NEXT deploy.

[build]
  # A hand-built static site: nothing to compile, publish the repo root as-is.
  publish = "."
  command = ""
